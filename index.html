    <style>
        :root {
            /* Light Mode Variables */
            --app-bg: #f4efe6;
            --primary: #0b3d24;
            --gold: #cfa052;
            --surface: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --success: #059669;
            --border: #e2e8f0;
            --radius-xl: 28px;
            --radius-lg: 18px;
            --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.04);
            --card-learned-bg: #f4fdf8;
        }

        body.dark-mode {
            /* Premium Dark Mode Variables */
            --app-bg: #0f172a; 
            --primary: #cfa052; 
            --surface: #1e293b;
            --text-dark: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow-card: 0 4px 12px rgba(0,0,0,0.3);
            --card-learned-bg: #064e3b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #cbd5e1;
            display: flex; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }

        .app-frame {
            width: 100%; max-width: 480px; background: var(--app-bg);
            height: 100vh; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.2);
            overflow: hidden; transition: background-color 0.3s;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--app-bg); display: flex; flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.3s;
        }

        #home-screen { transform: translateX(0); z-index: 1; }
        #list-screen { transform: translateX(100%); z-index: 2; }
        #flashcard-screen { transform: translateX(100%); z-index: 3; }

        /* ================= HOME ================= */
        .header-artistic {
            background: linear-gradient(145deg, #0b3d24 0%, #062b18 100%); color: white;
            padding: 45px 25px 70px 25px; position: relative;
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px; text-align: center;
        }
        body.dark-mode .header-artistic { background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%); border-bottom: 1px solid var(--border); }
        
        .theme-btn {
            position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.15); border: none;
            width: 42px; height: 42px; border-radius: 50%; color: var(--gold); cursor: pointer; z-index: 10;
        }
        .theme-btn svg { width: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;}
        
        .bismillah { font-family: 'Amiri', serif; font-size: 28px; color: var(--gold); margin-bottom: 10px; }
        .header-title { font-size: 24px; font-weight: 700; }
        .header-subtitle { font-size: 14px; color: rgba(255,255,255,0.7); }

        .dashboard { padding: 0 20px; margin-top: -45px; position: relative; z-index: 10; flex: 1; overflow-y: auto;}
        .dashboard::-webkit-scrollbar { display: none; }

        .progress-card { background: var(--surface); border-radius: var(--radius-xl); padding: 25px 20px; text-align: center; border: 1px solid var(--border); margin-bottom: 25px; transition: 0.3s;}
        .progress-circle-wrap { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; position: relative; }
        .progress-circle-inner { width: 100px; height: 100px; background: var(--surface); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-direction: column;}
        .progress-percent { font-size: 26px; font-weight: 700; color: var(--primary);}
        .progress-text { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 4px;}

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding-bottom: 20px; }
        .menu-full { grid-column: span 2; }
        .menu-btn { background: var(--surface); border-radius: var(--radius-lg); padding: 20px 15px; display: flex; align-items: center; gap: 15px; border: 1px solid var(--border); cursor: pointer;}
        .menu-icon { width: 45px; height: 45px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
        .menu-icon svg { width: 24px; fill: currentColor; }
        .menu-info { display: flex; flex-direction: column; }
        .menu-title { font-size: 16px; font-weight: 700; color: var(--text-dark); }
        .menu-count { font-size: 13px; color: var(--text-muted); font-weight: 600; }

        /* ================= LIST ================= */
        .list-app-bar { background: var(--surface); padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--border);}
        .back-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--app-bg); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;}
        .back-btn svg { width: 22px; stroke: var(--text-dark); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round;}
        .list-title { font-size: 18px; font-weight: 700; color: var(--text-dark); flex: 1; }

        .search-area { padding: 15px; background: var(--app-bg);}
        .search-box { width: 100%; padding: 14px 20px; border: 1px solid var(--border); border-radius: 30px; font-size: 15px; font-family: inherit; color: var(--text-dark); background: var(--surface); outline: none;}

        .words-list { flex: 1; padding: 0 15px 20px 15px; overflow-y: auto; scrollbar-width: none; }
        .words-list::-webkit-scrollbar { display: none; }
        
        .word-card { background: var(--surface); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 15px; border: 1px solid var(--border); border-left: 4px solid var(--gold); cursor: pointer; transition: 0.3s;}
        .word-card.learned { background: var(--card-learned-bg); border-color: var(--success); border-left-color: var(--success); }
        
        .check-box { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--text-muted); display: flex; align-items: center; justify-content: center; transition: 0.3s; flex-shrink: 0;}
        .word-card.learned .check-box { background: var(--success); border-color: var(--success); transform: scale(1.05);}
        .check-box svg { width: 14px; stroke: white; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; transition: 0.3s;}
        .word-card.learned .check-box svg { stroke-dashoffset: 0; }

        .word-content { flex: 1; display: flex; justify-content: space-between; align-items: center;}
        .text-bn { display: flex; flex-direction: column; gap: 4px; }
        .word-cat { font-size: 10px; background: var(--app-bg); color: var(--primary); padding: 2px 8px; border-radius: 12px; width: fit-content; font-weight: 700;}
        .word-card.learned .word-cat { background: rgba(5, 150, 105, 0.15); color: var(--success); }
        .meaning { font-size: 15px; font-weight: 600; color: var(--text-dark); }
        .meaning-en { font-size: 12px; color: var(--text-muted); }
        .arabic-word { font-family: 'Amiri', serif; font-size: 26px; color: var(--primary); direction: rtl; font-weight: 700;}

        /* ================= FLASHCARD ================= */
        .fc-area { flex: 1; position: relative; overflow: hidden; padding: 20px;}
        .fc-card { position: absolute; width: calc(100% - 40px); height: 400px; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--surface); border-radius: var(--radius-xl); border: 1px solid var(--border); box-shadow: 0 10px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px; transition: transform 0.3s; cursor: grab;}
        .fc-cat-tag { position: absolute; top: 20px; font-size: 12px; background: rgba(207, 160, 82, 0.15); color: var(--gold); padding: 5px 15px; border-radius: 20px; font-weight: 600;}
        .fc-ar { font-family: 'Amiri', serif; font-size: 55px; color: var(--primary); margin-bottom: 25px; line-height: 1.2; font-weight: 700;}
        .fc-bn { font-size: 26px; font-weight: 700; color: var(--text-dark); margin-bottom: 5px;}
        .fc-en { font-size: 16px; color: var(--text-muted); }
        .fc-controls { display: flex; justify-content: space-evenly; padding: 20px 40px 40px; background: var(--app-bg);}
        .fc-btn { width: 65px; height: 65px; border-radius: 50%; border: none; background: var(--surface); display: flex; justify-content: center; align-items: center; cursor: pointer;}
        .fc-btn.nope { border: 2px solid #ef4444; color: #ef4444; }
        .fc-btn.like { border: 2px solid var(--success); color: var(--success); }
        .fc-btn svg { width: 30px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>

<div class="app-frame">

</div>

/* --- App Logic --- */
const STORAGE_KEY = 'quranicWordApp_PremiumV6';
let learnedStatus = {};
let currentFilter = 'all';
let currentSearch = '';
let fcList = [];

// Load Data
try { const stored = localStorage.getItem(STORAGE_KEY); if (stored) learnedStatus = JSON.parse(stored); } catch(e) {}

// Celebration Check
let lastCelebrated = Math.floor(Object.values(learnedStatus).filter(Boolean).length / 50) * 50;

function saveStatus() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(learnedStatus)); } catch(e) {}
    updateDashboard();
    
    // Confetti Celebration for every 50 words learned
    let learnedCount = Object.values(learnedStatus).filter(Boolean).length;
    if(learnedCount >= lastCelebrated + 50) {
        lastCelebrated = Math.floor(learnedCount / 50) * 50;
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    }
}

function updateDashboard() {
    const total = wordsData.length; 
    const learned = Object.values(learnedStatus).filter(Boolean).length;
    const remaining = total - learned;
    const pct = total === 0 ? 0 : Math.round((learned / total) * 100);

    document.getElementById('ui-count-all').textContent = total + ' টি শব্দ';
    document.getElementById('ui-count-learned').textContent = learned + ' টি';
    document.getElementById('ui-count-remaining').textContent = remaining + ' টি';
    
    document.getElementById('ui-percent').textContent = pct + '%';
    document.getElementById('circle-progress').style.background = `conic-gradient(var(--gold) ${pct}%, ${document.body.classList.contains('dark-mode') ? '#334155' : '#e2e8f0'} ${pct}%)`;
    document.getElementById('ui-progress-text').textContent = `${learned} / ${total} শব্দ শেখা হয়েছে`;
}

// Dark Mode Toggle
function toggleTheme() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    document.getElementById('theme-btn-icon').innerHTML = isDark 
        ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>'
        : '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
    updateDashboard(); // Refresh circular progress color
}

// Navigation (With History API for Back Button)
function openScreen(filterType, titleText) {
    currentFilter = filterType;
    document.getElementById('list-title-text').textContent = titleText;
    document.getElementById('search-input').value = '';
    currentSearch = '';
    renderList(); 
    
    document.getElementById('home-screen').style.transform = 'translateX(-30%)';
    document.getElementById('list-screen').style.transform = 'translateX(0)';
    history.pushState({ screen: 'list' }, '', '#list');
}

function openFlashcard() {
    fcList = wordsData.filter(w => !learnedStatus[w[0]]);
    // Shuffle
    fcList.sort(() => Math.random() - 0.5);
    renderFlashcard();
    
    document.getElementById('home-screen').style.transform = 'translateX(-30%)';
    document.getElementById('flashcard-screen').style.transform = 'translateX(0)';
    history.pushState({ screen: 'flashcard' }, '', '#flashcard');
}

window.addEventListener('popstate', () => {
    document.getElementById('home-screen').style.transform = 'translateX(0)';
    document.getElementById('list-screen').style.transform = 'translateX(100%)';
    document.getElementById('flashcard-screen').style.transform = 'translateX(100%)';
    updateDashboard();
});

// Render List (No Lag)
function renderList() {
    const container = document.getElementById('words-list-container');
    container.innerHTML = ''; 
    
    let list = wordsData;
    if (currentFilter === 'learned') list = list.filter(w => learnedStatus[w[0]]);
    if (currentFilter === 'unlearned') list = list.filter(w => !learnedStatus[w[0]]);
    if (currentSearch.trim()) {
        const t = currentSearch.trim().toLowerCase();
        list = list.filter(w => w[1].toLowerCase().includes(t) || w[2].toLowerCase().includes(t) || w[3].toLowerCase().includes(t));
    }
    
    if (list.length === 0) { container.innerHTML = `<div class="empty-state">কোনো শব্দ পাওয়া যায়নি</div>`; return; }
    
    const frag = document.createDocumentFragment();
    list.forEach(([serial, arabic, bangla, english, category]) => {
        const card = document.createElement('div');
        card.className = `word-card ${learnedStatus[serial] ? 'learned' : ''}`;
        card.innerHTML = `
            <div class="check-box"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
            <div class="word-content">
                <div class="text-bn">
                    <span class="word-cat">${category}</span>
                    <span class="meaning">${bangla}</span>
                    <span class="meaning-en">${english}</span>
                </div>
                <div class="text-ar"><span class="arabic-word">${arabic}</span></div>
            </div>
        `;
        card.onclick = () => {
            learnedStatus[serial] = !learnedStatus[serial]; 
            saveStatus(); 
            learnedStatus[serial] ? card.classList.add('learned') : card.classList.remove('learned');
        };
        frag.appendChild(card);
    });
    container.appendChild(frag);
}

document.getElementById('search-input').addEventListener('input', e => { currentSearch = e.target.value; renderList(); });

// Flashcard Logic
function renderFlashcard() {
    const area = document.getElementById('fc-area');
    area.innerHTML = '';
    if(fcList.length === 0) { area.innerHTML = '<div style="text-align:center; color:var(--text-muted);">সব শব্দ শেখা শেষ! 🎉</div>'; return; }
    
    const w = fcList[0];
    const card = document.createElement('div');
    card.className = 'fc-card';
    card.id = 'active-fc';
    card.innerHTML = `
        <div class="fc-cat-tag">${w[4]}</div>
        <div class="fc-ar">${w[1]}</div>
        <div class="fc-bn">${w[2]}</div>
        <div class="fc-en">${w[3]}</div>
    `;
    area.appendChild(card);
}

function triggerSwipe(dir) {
    const card = document.getElementById('active-fc');
    if(!card) return;
    
    card.style.transform = `translate(-50%, -50%) translate(${dir === 'left' ? '-150%' : '150%'}, 0) rotate(${dir === 'left' ? '-20deg' : '20deg'})`;
    card.style.opacity = '0';
    
    if(dir === 'right') {
        learnedStatus[fcList[0][0]] = true; // Mark as learned
        saveStatus();
    }
    
    setTimeout(() => {
        fcList.shift();
        renderFlashcard();
    }, 300);
}

// Init
history.replaceState({ screen: 'home' }, '', window.location.pathname);
updateDashboard();
</script>
</body>
</html>
